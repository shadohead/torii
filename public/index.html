<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torii</title>
<meta name="theme-color" content="#0A0D15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torii">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="gate" viewBox="0 0 60 52" fill="none" aria-hidden="true">
      <path d="M2 8 Q30 2 58 8 L58 14 Q30 9 2 14 Z" fill="#E8503A"/>
      <rect x="8" y="20" width="44" height="5" fill="#E8503A"/>
      <rect x="14" y="14" width="5" height="38" fill="#E8503A"/>
      <rect x="41" y="14" width="5" height="38" fill="#E8503A"/>
    </svg>
    <div class="wordmark">TORII<small>鳥居</small></div>
    <div class="plex-pill" id="plex-pill"><span class="dot off"></span>Plex</div>
  </header>

  <div class="screen on" id="scr-home">
    <div class="searchbar"><input id="q" type="search" placeholder="Search anime..." autocomplete="off" enterkeyhint="search"></div>
    <div class="chips-row" id="chart-chips"></div>
    <div class="chips-row sub" id="season-chips" style="display:none"></div>
    <div id="home-rails">
      <div class="sec-title"><h2>Airing now</h2><span class="jp">放送中</span></div>
      <div class="rail" id="rail-airing"><div class="empty">Loading...</div></div>
      <div class="sec-title"><h2>Trending</h2><span class="jp">人気急上昇</span></div>
      <div class="grid" id="grid-trending"></div>
    </div>
    <div id="home-browse" style="display:none">
      <div class="sec-title"><h2 id="browse-title"></h2><span class="jp" id="browse-sub"></span></div>
      <div class="grid" id="grid-browse"></div>
      <button class="load-more" id="browse-more" style="display:none">Load more</button>
    </div>
    <div id="home-results" style="display:none">
      <div class="sec-title"><h2>Results</h2><span class="jp" id="res-count"></span></div>
      <div class="grid" id="grid-results"></div>
    </div>
  </div>

  <div class="screen" id="scr-watch">
    <div class="sec-title"><h2>Watchlist</h2><span class="jp">追跡中 · new episodes download automatically</span></div>
    <div id="wl-list"></div>
  </div>

  <div class="screen" id="scr-dl">
    <div class="sec-title"><h2>Active</h2><span class="jp" id="dl-active-count"></span></div>
    <div id="dl-active"></div>
    <div class="sec-title"><h2>Completed</h2><span class="jp">in Plex</span></div>
    <div id="dl-done"></div>
  </div>

  <div class="screen" id="scr-setup">
    <div class="sec-title"><h2>Setup</h2><span class="jp">設定</span></div>
    <div id="setup-body"><div class="empty">Loading...</div></div>
  </div>
</div>

<div class="detail" id="detail"></div>

<nav class="tabs"><div class="inner">
  <button class="on" data-scr="home" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    SEARCH</button>
  <button data-scr="watch" aria-label="Watchlist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.3.8-4.6 4.3 1.2 6.1-5.6-3-5.6 3 1.2-6.1L3 9.4l6.3-.8z"/></svg>
    WATCHLIST</button>
  <button data-scr="dl" style="position:relative" aria-label="Downloads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
    DOWNLOADS<span class="badge" id="dl-badge" style="display:none"></span></button>
  <button data-scr="setup" aria-label="Setup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
    SETUP</button>
</div></nav>

<div class="toast" id="toast"></div>
<script src="/app.js?v=4"></script>
</body>
</html>
